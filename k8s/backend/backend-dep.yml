apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: chatapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      name: backend-pods
      labels:
        app: backend
    spec:
      containers:
      - name: chatapp-backend
        image: wasay786/chatapp-backend:latest
        ports:
        - containerPort: 5001
        envFrom:
        - secretRef:
            name: backend-secrets
        - configMapRef:
            name: backend-configmap
        env:
        - name: PORT
          value: "5001"